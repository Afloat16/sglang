name: Validate native CPU Pooler normalization
on:
  push:
    branches: [validation/cpu-pooler-normalization-20261112]
permissions:
  contents: read
jobs:
  native-cpu:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      OPENBLAS_NUM_THREADS: "1"
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      SGLANG_USE_CPU_ENGINE: "1"
      HF_HUB_OFFLINE: "1"
      HF_DATASETS_OFFLINE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 6cfa1c2b244d2a7b9816ade3d58927e5fb9914bd
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install official CPU CI build tools
        run: |
          python -m pip install uv
          bash scripts/ci/utils/install_rust_protoc.sh
      - name: Install official CPU CI package and dependencies
        timeout-minutes: 40
        env:
          UV_SYSTEM_PYTHON: "1"
        run: |
          set -o pipefail
          uv pip install -e "python[dev]" --index-strategy unsafe-best-match --prerelease allow 2>&1 | tee sglang-install.log
          python -m pip freeze > sglang-environment.txt
      - name: Check exact native implementation and run CPU tests
        run: |
          python - <<'PY'
          import inspect
          from pathlib import Path
          import torch
          import sglang.srt.layers.pooler as pooler
          assert Path(inspect.getfile(pooler)).resolve() == Path("python/sglang/srt/layers/pooler.py").resolve()
          assert not torch.cuda.is_available()
          print("Native Pooler:", inspect.getfile(pooler), "Torch:", torch.__version__)
          PY
          set -o pipefail
          python -m pytest -q -p no:cacheprovider --junitxml=sglang-patched.xml test/registered/unit/layers/test_pooler_normalization.py test/registered/unit/layers/test_pooler_score_and_pool.py 2>&1 | tee sglang-patched.log
      - name: Restore exact upstream implementation
        run: |
          git show 721ef92c4c764bb3c2307378bf13609fc7be7e72:python/sglang/srt/layers/pooler.py > python/sglang/srt/layers/pooler.py
          find python/sglang/srt/layers/__pycache__ -name 'pooler.*.pyc' -delete
      - name: Confirm actual regression assertions fail on baseline
        run: |
          set +e
          python -m pytest -q -p no:cacheprovider --junitxml=sglang-baseline.xml test/registered/unit/layers/test_pooler_normalization.py > sglang-baseline.log 2>&1
          status=$?
          set -e
          cat sglang-baseline.log
          test "$status" -eq 1
          python - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse("sglang-baseline.xml").getroot()
          assert not root.findall(".//error"), "Baseline must fail assertions, not imports."
          failed = {case.attrib["name"] for case in root.findall(".//testcase") if case.find("failure") is not None}
          required = {"test_zero_vectors", "test_norm_above_float16_range", "test_ragged_dimensions_zero_large_and_tiny", "test_cosine_retrieval_keeps_the_nearest_direction"}
          assert required <= failed, (required - failed, failed)
          print("Confirmed original normalization failures:", sorted(failed))
          PY
      - name: Restore exact patch
        if: always()
        run: git restore --source=HEAD -- python/sglang/srt/layers/pooler.py
      - name: Save native validation evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: native-cpu-pooler-evidence
          path: |
            sglang-install.log
            sglang-environment.txt
            sglang-patched.log
            sglang-patched.xml
            sglang-baseline.log
            sglang-baseline.xml
